# Redirect all HTTP traffic to HTTPS
server {
    listen 80;
    server_name localhost 13.203.177.222.nip.io;
    return 301 https://$host$request_uri;
}

# HTTPS server block
server {
    listen 443 ssl;
    server_name 13.203.177.222.nip.io;

    # SSL Certificates (mounted from the host)
    ssl_certificate /etc/letsencrypt/live/13.203.177.222.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/13.203.177.222.nip.io/privkey.pem;

    # Recommended SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Where the frontend files are located
    root /usr/share/nginx/html;
    index index.html;

    # React Router config: send all requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend container
    location /api/ {
        # Use Docker's internal DNS resolver
        resolver 127.0.0.11 valid=30s;
        set $backend_upstream http://backend:5000;
        
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
