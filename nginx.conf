server {
    listen 80;
    server_name localhost;

    # Where the frontend files are located
    root /usr/share/nginx/html;
    index index.html;

    # React Router config: send all requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend container
    location /api/ {
        # Use Docker's internal DNS resolver to prevent Nginx from crashing 
        # if the backend container restarts or isn't ready instantly
        resolver 127.0.0.11 valid=30s;
        set $backend_upstream http://backend:5000;
        
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
